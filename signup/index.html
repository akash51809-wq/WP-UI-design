></button></form><a class="back-link" href="../login/">← Back to Sign In</a><div class="small-note">Account creation is currently a frontend UI flow. Backend registration can be connected later.</div></div><div class="login-foot"><span>© 2026 Easy Recharge Solution</span><span>Privacy · Terms · Support</span></div></section></main></body></html>
